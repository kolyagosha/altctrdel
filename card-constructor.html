<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALT CTRL DEL — Card Back Constructor (Mini-PS Edition)</title>
<style>
  :root {
    --bg: #0e0e14;
    --surface: #16161f;
    --surface2: #1e1e2a;
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: #888;
    --accent: #c8f135;
    --accent-dark: #a0c520;
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; min-height: 100vh; }

  header { border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; display: flex; align-items: center; gap: 1rem; }
  .logo-text { font-size: 1.1rem; letter-spacing: 0.15em; color: var(--accent); font-weight: bold; }
  .logo-sub  { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; }

  .main { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 73px); }

  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 1.5rem; display: flex; flex-direction: column; gap: 1.1rem; overflow-y: auto; }
  .section-label { font-size: 0.65rem; letter-spacing: 0.15em; color: var(--accent); text-transform: uppercase; margin-bottom: 0.4rem; }
  .field-group { display: flex; flex-direction: column; gap: 0.4rem; }
  .field-label { font-size: 0.75rem; color: var(--muted); }

  input[type="text"] { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: inherit; font-size: 0.85rem; padding: 0.6rem 0.8rem; width: 100%; outline: none; transition: border-color 0.2s; }
  input[type="text"]:focus { border-color: var(--accent); }
  select { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-family: inherit; font-size: 0.85rem; padding: 0.6rem 0.8rem; width: 100%; outline: none; cursor: pointer; }
  .color-row { display: grid; grid-template-columns: 44px 1fr; gap: 8px; align-items: center; }
  input[type="color"] { width: 44px; height: 38px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface2); cursor: pointer; padding: 3px; }
  
  .flex-row { display: flex; gap: 10px; }
  .flex-row input { flex: 1; }

  .btn { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0.6rem 1rem; cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-accent { background: var(--accent); color: #000; border: none; font-weight: bold; }
  .btn-accent:hover { background: var(--accent-dark); }
  .btn-danger { color: #ff4444; border-color: rgba(255,68,68,0.3); }
  .btn-danger:hover { background: rgba(255,68,68,0.1); border-color: #ff4444; color: #ff4444; }

  .divider { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; }

  .preview-area { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2.5rem 2rem; gap: 1.25rem; }
  .preview-label { font-size: 0.65rem; letter-spacing: 0.2em; color: var(--muted); text-transform: uppercase; }

  .card-shell {
    width: min(360px, 100%);
    aspect-ratio: 105 / 148;
    border-radius: 10px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 32px 64px rgba(0,0,0,0.6);
    user-select: none;
  }

  .card-canvas { width: 100%; height: 100%; position: relative; overflow: hidden; }
  .card-pattern-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

  /* СЛОИ (Layers) */
  .layer-item {
    position: absolute;
    cursor: move;
    display: flex;
    align-items: center;
    justify-content: center;
    transform-origin: center;
  }

  .layer-item.selected { outline: 1.5px dashed rgba(200,241,53,0.8); outline-offset: 2px; }
  .layer-item img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: block; }
  .layer-item .text-content { font-family: 'Courier New', monospace; white-space: nowrap; pointer-events: none; }
  
  .resize-handle {
    position: absolute;
    bottom: -6px;
    right: -6px;
    width: 14px;
    height: 14px;
    background: var(--accent);
    border-radius: 50%;
    cursor: se-resize;
    display: none;
    box-shadow: 0 0 0 2px rgba(0,0,0,0.4);
  }
  .layer-item.selected .resize-handle { display: block; }

  /* BOTTOM TEXT */
  .card-bottom {
    position: absolute; bottom: 0; left: 0; right: 0; padding: 4% 8% 5%;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    pointer-events: none; z-index: 9999;
  }
  .card-bar-name { font-weight: bold; text-align: center; letter-spacing: 0.06em; line-height: 1.2; }
  .card-slogan   { text-align: center; opacity: 0.65; }
  .card-url      { opacity: 0.28; letter-spacing: 0.1em; margin-top: 2px; }
  .card-corner { position: absolute; opacity: 0.12; z-index: 9999; font-size: 0.55rem; letter-spacing: 0.1em; pointer-events: none; }
  .card-corner.tl { top: 5%; left: 5%; }
  .card-corner.tr { top: 5%; right: 5%; }

  /* LAYER CONTROLS UI */
  #layerControls { display: none; background: rgba(200,241,53,0.05); padding: 1rem; border-radius: var(--radius-sm); border: 1px solid rgba(200,241,53,0.2); }
  #layerControls.active { display: flex; flex-direction: column; gap: 0.8rem; }
  
  .slider-row { display: flex; align-items: center; gap: 10px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
  
  input[type="file"] { display: none; }

  /* ========================================= */
  /* МАГИЯ ПЕЧАТИ (4 карточки на А4)           */
  /* ========================================= */
  @media print {
    body { background: #fff !important; margin: 0; padding: 0; }
    header, .sidebar, .preview-area, .main { display: none !important; }
    @page { size: A4 portrait; margin: 0; }

    #printZone {
      display: flex !important;
      flex-wrap: wrap;
      width: 210mm;
      height: 297mm;
      margin: 0;
      align-content: flex-start;
    }

    .print-clone {
      width: 105mm !important;
      height: 148.5mm !important;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      border-right: 0.5px dashed #ccc;
      border-bottom: 0.5px dashed #ccc;
      box-shadow: none !important;
    }
    
    .print-clone .resize-handle { display: none !important; }
    .print-clone.layer-item { outline: none !important; }
  }
</style>
</head>
<body>

<!-- СКРЫТАЯ ЗОНА ДЛЯ ПЕЧАТИ -->
<div id="printZone" style="display: none;"></div>

<header>
  <div>
    <div class="logo-text">ALT CTRL DEL</div>
    <div class="logo-sub">card back constructor · PRO LAYER EDITION</div>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    
    <!-- ТУЛЗЫ ДЛЯ СЛОЕВ -->
    <div>
      <div class="section-label">Add Layers (Mini-PS)</div>
      <div class="flex-row" style="margin-bottom: 0.5rem;">
        <button class="btn" style="flex:1" onclick="document.getElementById('imgUpload').click()">+ Image</button>
        <input type="file" id="imgUpload" accept="image/*">
      </div>
      <div class="flex-row">
        <input type="text" id="newTextVal" placeholder="Custom text...">
        <button class="btn" onclick="addTextLayer()">+ Text</button>
      </div>
    </div>

    <!-- ПАНЕЛЬ ВЫДЕЛЕННОГО СЛОЯ -->
    <div id="layerControls">
      <div class="section-label" style="color:#fff;">Selected Layer Tools</div>
      
      <div class="field-group">
        <div class="field-label">Opacity (<span id="opVal">100</span>%)</div>
        <input type="range" id="layerOpacity" min="0" max="1" step="0.05" value="1">
      </div>

      <div class="field-group">
        <div class="field-label">Blend Mode (Наложение)</div>
        <select id="layerBlend">
          <option value="normal">Normal</option>
          <option value="multiply">Multiply</option>
          <option value="screen">Screen</option>
          <option value="overlay">Overlay</option>
          <option value="difference">Difference</option>
        </select>
      </div>
      
      <div class="flex-row">
        <button class="btn" onclick="moveLayer(1)">Bring Fwd</button>
        <button class="btn" onclick="moveLayer(-1)">Send Back</button>
      </div>
      <button class="btn btn-danger" onclick="deleteLayer()">Delete Layer</button>
    </div>

    <hr class="divider">

    <!-- НАСТРОЙКИ ФОНА -->
    <div>
      <div class="section-label">Background & Bar Info</div>
      <div style="display:flex;flex-direction:column;gap:0.75rem;">
        <div class="color-row">
          <input type="color" id="bgColor" value="#1a1a2e">
          <select id="patternSelect" style="flex:1">
            <option value="none">Solid</option>
            <option value="dots" selected>Dots</option>
            <option value="grid">Grid</option>
            <option value="diagonal">Diagonals</option>
            <option value="cross">Cross</option>
            <option value="hex">Hex</option>
          </select>
        </div>
        <div class="color-row">
          <input type="color" id="txtColor" value="#f0f0f0">
          <div class="field-label">Global Text Color</div>
        </div>
        <input type="text" id="barName" placeholder="Bar / café name" maxlength="40">
        <input type="text" id="slogan" placeholder="Tagline (optional)" maxlength="60">
      </div>
    </div>

    <hr class="divider">

    <div style="display:flex;flex-direction:column;gap:0.6rem;">
      <button class="btn btn-accent" onclick="printCardX4()">Print deck (A4 x4)</button>
      
      <!-- ДВЕ КНОПКИ ДЛЯ СОХРАНЕНИЯ -->
      <div class="flex-row">
        <button class="btn" style="flex:1" onclick="downloadSVG()">↓ SVG</button>
        <button class="btn" style="flex:1" onclick="downloadPNG()">↓ PNG</button>
      </div>
      
      <button class="btn" style="border:none; text-decoration:underline;" onclick="location.reload()">Reset All</button>
    </div>
  </aside>

  <section class="preview-area">
    <div class="preview-label">Mini-PS: Drag freely · Resize (green dot) · Layer Tools in sidebar</div>

    <div class="card-shell" id="cardShell">
      <div class="card-canvas" id="cardCanvas">
        <svg class="card-pattern-svg" id="patternSvg" viewBox="0 0 600 425" preserveAspectRatio="xMidYMid slice"></svg>
        
        <div id="layersContainer" style="position: absolute; inset: 0; z-index: 10;"></div>

        <div class="card-bottom">
          <div class="card-bar-name" id="barNameEl"></div>
          <div class="card-slogan"   id="sloganEl"></div>
          <div class="card-url"      id="urlEl" style="font-size:0.5rem;">altctrdel.xyz</div>
        </div>
        <div class="card-corner tl" id="cornerTL">ALT CTRL DEL</div>
        <div class="card-corner tr" id="cornerTR">ALT CTRL DEL</div>
      </div>
    </div>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);

let zIndexCounter = 100;
let activeLayer = null;

const canvas = $('layersContainer');
const cardCanvas = $('cardCanvas');

function updateBackground() {
  const bg = $('bgColor').value;
  const txt = $('txtColor').value;
  cardCanvas.style.background = bg;
  
  $('barNameEl').style.color = txt;
  $('barNameEl').textContent = $('barName').value;
  $('sloganEl').style.color = txt;
  $('sloganEl').textContent = $('slogan').value;
  $('urlEl').style.color = txt;
  $('cornerTL').style.color = txt;
  $('cornerTR').style.color = txt;
  
  drawPattern(bg, txt);
}

$('bgColor').oninput = updateBackground;
$('txtColor').oninput = updateBackground;
$('barName').oninput = updateBackground;
$('slogan').oninput = updateBackground;
$('patternSelect').onchange = updateBackground;


function createLayerWrap() {
  const wrap = document.createElement('div');
  wrap.className = 'layer-item';
  wrap.style.zIndex = zIndexCounter++;
  wrap.style.left = '50px';
  wrap.style.top = '50px';
  wrap.style.opacity = '1';
  wrap.style.mixBlendMode = 'normal';
  
  const handle = document.createElement('div');
  handle.className = 'resize-handle';
  wrap.appendChild(handle);
  
  canvas.appendChild(wrap);
  makeDraggableAndResizable(wrap, handle);
  selectLayer(wrap);
  return wrap;
}

$('imgUpload').onchange = function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const wrap = createLayerWrap();
      wrap.dataset.type = 'image';
      wrap.dataset.src = ev.target.result;
      
      const ratio = img.naturalHeight / img.naturalWidth;
      let w = 150;
      let h = w * ratio;
      wrap.style.width = w + 'px';
      wrap.style.height = h + 'px';
      
      const imgEl = document.createElement('img');
      imgEl.src = ev.target.result;
      wrap.insertBefore(imgEl, wrap.firstChild);
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  this.value = ''; 
};

function addTextLayer() {
  const textVal = $('newTextVal').value || 'Hello World';
  const wrap = createLayerWrap();
  wrap.dataset.type = 'text';
  wrap.style.width = '150px';
  wrap.style.height = '40px';
  
  const txtEl = document.createElement('div');
  txtEl.className = 'text-content';
  txtEl.textContent = textVal;
  txtEl.style.fontSize = '24px'; 
  txtEl.style.color = $('txtColor').value;
  
  wrap.insertBefore(txtEl, wrap.firstChild);
  $('newTextVal').value = '';
}

function makeDraggableAndResizable(wrap, handle) {
  let isDragging = false, isResizing = false;
  let startX, startY, startW, startH, startLeft, startTop;

  wrap.addEventListener('mousedown', e => {
    if (e.target === handle) return; 
    selectLayer(wrap);
    isDragging = true;
    startX = e.clientX; startY = e.clientY;
    startLeft = parseFloat(wrap.style.left) || 0;
    startTop = parseFloat(wrap.style.top) || 0;
    e.preventDefault();
  });

  handle.addEventListener('mousedown', e => {
    selectLayer(wrap);
    isResizing = true;
    startX = e.clientX; startY = e.clientY;
    startW = parseFloat(wrap.style.width) || 0;
    startH = parseFloat(wrap.style.height) || 0;
    e.preventDefault();
    e.stopPropagation();
  });

  document.addEventListener('mousemove', e => {
    if (isDragging && activeLayer === wrap) {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      wrap.style.left = (startLeft + dx) + 'px';
      wrap.style.top = (startTop + dy) + 'px';
    }
    if (isResizing && activeLayer === wrap) {
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      
      if (wrap.dataset.type === 'image') {
        const ratio = startH / startW;
        let newW = startW + dx;
        if (newW < 20) newW = 20;
        wrap.style.width = newW + 'px';
        wrap.style.height = (newW * ratio) + 'px';
      } else {
        let newW = Math.max(30, startW + dx);
        let newH = Math.max(20, startH + dy);
        wrap.style.width = newW + 'px';
        wrap.style.height = newH + 'px';
        const txtEl = wrap.querySelector('.text-content');
        if(txtEl) txtEl.style.fontSize = (newH * 0.7) + 'px';
      }
    }
  });

  document.addEventListener('mouseup', () => { isDragging = false; isResizing = false; });
}

cardCanvas.addEventListener('mousedown', e => {
  if (e.target === cardCanvas || e.target.id === 'layersContainer' || e.target.tagName === 'svg') {
    selectLayer(null);
  }
});

function selectLayer(layer) {
  if (activeLayer) activeLayer.classList.remove('selected');
  activeLayer = layer;
  if (activeLayer) {
    activeLayer.classList.add('selected');
    $('layerControls').classList.add('active');
    $('layerOpacity').value = activeLayer.style.opacity || 1;
    $('opVal').textContent = Math.round($('layerOpacity').value * 100);
    $('layerBlend').value = activeLayer.style.mixBlendMode || 'normal';
  } else {
    $('layerControls').classList.remove('active');
  }
}

$('layerOpacity').oninput = e => {
  if(!activeLayer) return;
  activeLayer.style.opacity = e.target.value;
  $('opVal').textContent = Math.round(e.target.value * 100);
};

$('layerBlend').onchange = e => {
  if(!activeLayer) return;
  activeLayer.style.mixBlendMode = e.target.value;
};

function moveLayer(dir) {
  if(!activeLayer) return;
  let currZ = parseInt(activeLayer.style.zIndex) || 100;
  activeLayer.style.zIndex = currZ + dir;
}

function deleteLayer() {
  if(!activeLayer) return;
  activeLayer.remove();
  selectLayer(null);
}

function drawPattern(bg, txt) {
  const p = $('patternSelect').value;
  const svg = $('patternSvg');
  const W = 600, H = 425;
  let out = '';
  if (p === 'dots') {
    for (let x = 0; x <= W; x += 20) for (let y = 0; y <= H; y += 20)
      out += `<circle cx="${x}" cy="${y}" r="1.4" fill="${txt}" opacity="0.09"/>`;
  } else if (p === 'grid') {
    for (let x = 0; x <= W; x += 30) out += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${txt}" stroke-width="0.5" opacity="0.08"/>`;
    for (let y = 0; y <= H; y += 30) out += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${txt}" stroke-width="0.5" opacity="0.08"/>`;
  } else if (p === 'diagonal') {
    for (let i = -H; i < W + H; i += 24)
      out += `<line x1="${i}" y1="0" x2="${i+H}" y2="${H}" stroke="${txt}" stroke-width="0.7" opacity="0.08"/>`;
  } else if (p === 'cross') {
    for (let x = 0; x <= W; x += 24) out += `<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="${txt}" stroke-width="0.4" opacity="0.07"/>`;
    for (let y = 0; y <= H; y += 24) out += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${txt}" stroke-width="0.4" opacity="0.07"/>`;
  } else if (p === 'hex') {
    const s = 22, h = s * Math.sqrt(3);
    for (let row = -1; row < H/h + 1; row++) {
      for (let col = -1; col < W/(s*1.5) + 1; col++) {
        const cx = col * s * 1.5 + (row % 2 === 0 ? 0 : s * 0.75);
        const cy = row * h * 0.5;
        const pts = [];
        for (let a = 0; a < 6; a++) {
          const ang = Math.PI / 180 * (60 * a - 30);
          pts.push(`${cx + s * 0.85 * Math.cos(ang)},${cy + s * 0.85 * Math.sin(ang)}`);
        }
        out += `<polygon points="${pts.join(' ')}" fill="none" stroke="${txt}" stroke-width="0.5" opacity="0.07"/>`;
      }
    }
  }
  svg.innerHTML = out;
}

// --- ЯДРО ГЕНЕРАЦИИ SVG-КОДА ---
// Вынесли в отдельную функцию, чтобы и SVG и PNG брали отсюда одни и те же данные
function getGeneratedSvgString() {
  selectLayer(null);

  const bg = $('bgColor').value;
  const txt = $('txtColor').value;
  const name = $('barName').value || 'Your Bar';
  const slogan = $('slogan').value;

  const W = 397, H = 559;
  const cardRect = cardCanvas.getBoundingClientRect();
  const scaleX = W / cardRect.width;
  const scaleY = H / cardRect.height;

  const patEl = $('patternSvg').innerHTML;

  let layersSVG = '';
  const layers = Array.from(canvas.querySelectorAll('.layer-item')).sort((a,b) => {
      return (parseInt(a.style.zIndex)||0) - (parseInt(b.style.zIndex)||0);
  });

  layers.forEach(layer => {
    const lx = parseFloat(layer.style.left) * scaleX;
    const ly = parseFloat(layer.style.top) * scaleY;
    const lw = parseFloat(layer.style.width) * scaleX;
    const lh = parseFloat(layer.style.height) * scaleY;
    const op = layer.style.opacity || 1;
    const blend = layer.style.mixBlendMode || 'normal';
    const styleAttr = `opacity="${op}" style="mix-blend-mode: ${blend};"`;

    if (layer.dataset.type === 'image') {
      const src = layer.dataset.src;
      layersSVG += `<image href="${src}" x="${lx}" y="${ly}" width="${lw}" height="${lh}" preserveAspectRatio="xMidYMid meet" ${styleAttr}/>\n`;
    } else if (layer.dataset.type === 'text') {
      const textVal = layer.querySelector('.text-content').textContent;
      const fs = parseFloat(layer.querySelector('.text-content').style.fontSize) * scaleY;
      layersSVG += `<text x="${lx}" y="${ly + fs*0.8}" font-size="${fs}" font-family="'Courier New',monospace" fill="${txt}" ${styleAttr}>${textVal}</text>\n`;
    }
  });

  const nameEl = name ? `<text x="${W/2}" y="${H-50}" text-anchor="middle" font-size="26" font-weight="bold" fill="${txt}" font-family="'Courier New',monospace" letter-spacing="2">${name}</text>` : '';
  const sloganEl = slogan ? `<text x="${W/2}" y="${H-28}" text-anchor="middle" font-size="13" fill="${txt}" font-family="'Courier New',monospace" opacity="0.65">${slogan}</text>` : '';

  return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="105mm" height="148mm" viewBox="0 0 ${W} ${H}">
  <rect width="${W}" height="${H}" fill="${bg}" rx="8"/>
  ${patEl}
  ${layersSVG}
  ${nameEl}
  ${sloganEl}
  <text x="${W/2}" y="${H-10}" text-anchor="middle" font-size="9" fill="${txt}" opacity="0.28" font-family="'Courier New',monospace" letter-spacing="3">altctrdel.xyz</text>
  <text x="16" y="20" font-size="8" fill="${txt}" opacity="0.12" font-family="'Courier New',monospace" letter-spacing="2">ALT CTRL DEL</text>
  <text x="${W-16}" y="20" text-anchor="end" font-size="8" fill="${txt}" opacity="0.12" font-family="'Courier New',monospace" letter-spacing="2">ALT CTRL DEL</text>
</svg>`;
}

// --- СКАЧАТЬ КАК SVG ---
function downloadSVG() {
  const svgOut = getGeneratedSvgString();
  const name = $('barName').value || 'Your Bar';
  const blob = new Blob([svgOut], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `altctrdel-ps-${name.toLowerCase().replace(/\s+/g,'-')}.svg`;
  a.click();
  URL.revokeObjectURL(url);
}

// --- СКАЧАТЬ КАК PNG (High-Res) ---
function downloadPNG() {
  const svgOut = getGeneratedSvgString();
  const name = $('barName').value || 'Your Bar';
  
  // Устанавливаем жесткий размер холста 1240x1748 px (это А6 при 300 DPI)
  const W = 1240;
  const H = 1748;

  const canvasObj = document.createElement('canvas');
  canvasObj.width = W;
  canvasObj.height = H;
  const ctx = canvasObj.getContext('2d');

  const img = new Image();
  // Кодируем SVG строку, чтобы ее съел тег <img>
  const blob = new Blob([svgOut], { type: 'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(blob);

  img.onload = function() {
    // Рисуем отрендеренный браузером SVG на нашем холсте, растягивая на все 300 DPI
    ctx.drawImage(img, 0, 0, W, H);
    URL.revokeObjectURL(url);
    
    // Превращаем холст в сочный PNG
    const pngUrl = canvasObj.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = pngUrl;
    a.download = `altctrdel-ps-${name.toLowerCase().replace(/\s+/g,'-')}.png`;
    a.click();
  };
  img.src = url;
}

// --- ПЕЧАТЬ 4 НА А4 ---
function printCardX4() {
  selectLayer(null); 
  
  const printZone = $('printZone');
  printZone.innerHTML = ''; 
  
  const card = $('cardShell');
  
  for(let i = 0; i < 4; i++) {
    let clone = card.cloneNode(true); 
    clone.className = 'print-clone';
    printZone.appendChild(clone);
  }
  
  window.print();
}
